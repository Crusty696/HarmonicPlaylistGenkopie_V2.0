name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggert bei Tags wie v3.0.0, v3.1.0, etc.

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12.10'

    - name: Get Version from Tag
      id: get_version
      shell: pwsh
      run: |
        $VERSION = "${{ github.ref_name }}"
        echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Verify tag matches application version
      shell: pwsh
      run: |
        $tagVersion = "${{ github.ref_name }}".TrimStart('v')
        $appVersion = python -c "from hpg_core.app_metadata import APP_VERSION; print(APP_VERSION)"
        if ($LASTEXITCODE -ne 0 -or $tagVersion -ne $appVersion.Trim()) {
          throw "Tag version $tagVersion does not match APP_VERSION $appVersion"
        }

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run release test gate
      run: python -m pytest tests/ -q

    - name: Compile Python sources
      shell: pwsh
      run: |
        python -m compileall -q main.py hpg_core tools
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build Executable
      run: |
        cmd /c build.bat
      shell: cmd

    - name: Verify exact EXE was created
      shell: pwsh
      run: |
        $exePath = "HarmonicPlaylistGenerator.exe"
        if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
          throw "Exact release executable missing: $exePath"
        }
        Get-Item -LiteralPath $exePath | Select-Object FullName, Length

    - name: Install Inno Setup
      shell: pwsh
      run: choco install innosetup --yes --no-progress

    - name: Build installer
      shell: cmd
      run: call build_installer.bat

    - name: Verify installer
      shell: pwsh
      run: |
        $installerPath = "installer_output\HPG_${{ github.ref_name }}_Setup.exe"
        if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
          throw "Exact installer artifact missing: $installerPath"
        }

    - name: Silent install, frozen worker, GUI, and uninstall smoke
      timeout-minutes: 10
      shell: pwsh
      run: |
        & .github/scripts/test_installer_runtime.ps1 `
          -InstallerPath "installer_output/HPG_${{ github.ref_name }}_Setup.exe" `
          -StandaloneExePath "HarmonicPlaylistGenerator.exe"

    - name: Create release manifest
      run: >-
        python tools/release_manifest.py
        HarmonicPlaylistGenerator.exe
        installer_output/HPG_${{ github.ref_name }}_Setup.exe
        --output release-manifest.json

    - name: Create Release Notes
      shell: pwsh
      run: |
        $VERSION = "${{ steps.get_version.outputs.VERSION }}"
        $NOTES = @"
        # 🎵 Harmonic Playlist Generator $VERSION

        **Multi-Core Optimized DJ Playlist Generator**

        ## 📥 Download

        Download the installer or portable \`HarmonicPlaylistGenerator.exe\`
        below (Windows 10/11, 64-bit).

        ## 🚀 Installation

        1. Download the executable
        2. Run it (no installation required!)
        3. Select your music folder
        4. Generate playlists!

        ## 📝 What's New

        The detailed changes are listed in the automatically generated GitHub release notes.

        ## 🐛 Bug Reports

        [Report issues](https://github.com/Crusty696/HarmonicPlaylistGenkopie_V2.0/issues)

        ---

        **Generated automatically via GitHub Actions** 🤖
        "@

        $NOTES | Out-File -FilePath "release_notes.md" -Encoding UTF8

    - name: Upload verified release candidate
      uses: actions/upload-artifact@v7
      with:
        name: hpg-release-candidate-${{ github.sha }}
        path: |
          HarmonicPlaylistGenerator.exe
          installer_output/HPG_${{ github.ref_name }}_Setup.exe
          release-manifest.json
          release_notes.md
        if-no-files-found: error
        retention-days: 7

  publish:
    needs: build-and-verify
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write

    steps:
    - name: Download verified release candidate
      uses: actions/download-artifact@v7
      with:
        name: hpg-release-candidate-${{ github.sha }}
        path: release-candidate

    - name: Verify candidate boundary and manifest
      shell: pwsh
      run: |
        $root = (Resolve-Path -LiteralPath "release-candidate").Path
        $exe = Join-Path $root "HarmonicPlaylistGenerator.exe"
        $installer = Join-Path $root "installer_output/HPG_${{ github.ref_name }}_Setup.exe"
        $manifestPath = Join-Path $root "release-manifest.json"
        $notes = Join-Path $root "release_notes.md"
        $expectedPaths = @($exe, $installer, $manifestPath, $notes) |
          ForEach-Object { [System.IO.Path]::GetFullPath($_) }
        $actualPaths = @(Get-ChildItem -LiteralPath $root -Recurse -File) |
          ForEach-Object { $_.FullName }
        $unexpected = @($actualPaths | Where-Object { $_ -notin $expectedPaths })
        $missing = @($expectedPaths | Where-Object { $_ -notin $actualPaths })
        if ($unexpected.Count -ne 0 -or $missing.Count -ne 0) {
          throw "Release candidate boundary mismatch"
        }

        $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
        if ($manifest.commit -ne "${{ github.sha }}") {
          throw "Manifest commit does not match release commit"
        }
        if ($manifest.source_clean -ne $true) {
          throw "Manifest source was not clean"
        }
        if ($manifest.version -ne "${{ github.ref_name }}".TrimStart("v")) {
          throw "Manifest version does not match release tag"
        }
        if (@($manifest.artifacts).Count -ne 2) {
          throw "Manifest must contain exactly two release binaries"
        }
        foreach ($artifactPath in @($exe, $installer)) {
          $name = Split-Path -Leaf $artifactPath
          $entries = @($manifest.artifacts | Where-Object { $_.path -eq $name })
          if ($entries.Count -ne 1) {
            throw "Manifest entry missing or duplicated: $name"
          }
          $file = Get-Item -LiteralPath $artifactPath
          $hash = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash
          if ([int64]$entries[0].size -ne $file.Length -or
              $entries[0].sha256 -ne $hash.ToLowerInvariant()) {
            throw "Manifest integrity mismatch: $name"
          }
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-candidate/HarmonicPlaylistGenerator.exe
          release-candidate/installer_output/HPG_${{ github.ref_name }}_Setup.exe
          release-candidate/release-manifest.json
        body_path: release-candidate/release_notes.md
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload release backup
      uses: actions/upload-artifact@v7
      with:
        name: HarmonicPlaylistGenerator-${{ github.ref_name }}
        path: |
          release-candidate/HarmonicPlaylistGenerator.exe
          release-candidate/installer_output/HPG_${{ github.ref_name }}_Setup.exe
          release-candidate/release-manifest.json
        if-no-files-found: error
        retention-days: 30
