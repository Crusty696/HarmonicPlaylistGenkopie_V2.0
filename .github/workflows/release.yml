name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggert bei Tags wie v3.0.0, v3.1.0, etc.

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.10'

    - name: Get Version from Tag
      id: get_version
      shell: pwsh
      run: |
        $VERSION = "${{ github.ref_name }}"
        echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Verify tag matches application version
      shell: pwsh
      run: |
        $tagVersion = "${{ github.ref_name }}".TrimStart('v')
        $appVersion = python -c "from hpg_core.app_metadata import APP_VERSION; print(APP_VERSION)"
        if ($LASTEXITCODE -ne 0 -or $tagVersion -ne $appVersion.Trim()) {
          throw "Tag version $tagVersion does not match APP_VERSION $appVersion"
        }

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run release test gate
      run: python -m pytest tests/ -q

    - name: Compile Python sources
      shell: pwsh
      run: |
        python -m compileall -q main.py hpg_core tools
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build Executable
      run: |
        cmd /c build.bat
      shell: cmd

    - name: Verify EXE was created
      shell: pwsh
      run: |
        $exeFile = Get-ChildItem -Recurse -Filter "HarmonicPlaylistGenerator.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

        if ($exeFile) {
          Write-Host "✅ EXE found: $($exeFile.FullName)"
          Write-Host "   Size: $([math]::Round($exeFile.Length / 1MB, 2)) MB"

          # Copy to predictable location (only if not already in working directory)
          $targetPath = Join-Path (Get-Location) "HarmonicPlaylistGenerator.exe"
          if ($exeFile.FullName -ne $targetPath) {
            Copy-Item $exeFile.FullName "HarmonicPlaylistGenerator.exe" -Force
            Write-Host "   Copied to working directory"
          } else {
            Write-Host "   EXE already in working directory, no copy needed"
          }
        } else {
          Write-Error "❌ EXE not found!"
          exit 1
        }

    - name: Frozen application startup smoke
      shell: pwsh
      run: |
        $process = Start-Process -FilePath ".\HarmonicPlaylistGenerator.exe" -PassThru
        Start-Sleep -Seconds 8
        if ($process.HasExited) {
          throw "Frozen application exited during startup smoke with code $($process.ExitCode)"
        }
        Stop-Process -Id $process.Id -Force

    - name: Install Inno Setup
      shell: pwsh
      run: choco install innosetup --yes --no-progress

    - name: Build installer
      shell: cmd
      run: call build_installer.bat

    - name: Verify installer
      shell: pwsh
      run: |
        $installerPath = "installer_output\HPG_${{ github.ref_name }}_Setup.exe"
        if (-not (Test-Path $installerPath)) {
          throw "Installer artifact missing"
        }

    - name: Create release manifest
      run: >-
        python tools/release_manifest.py
        HarmonicPlaylistGenerator.exe
        installer_output/HPG_${{ github.ref_name }}_Setup.exe
        --output release-manifest.json

    - name: Create Release Notes
      shell: pwsh
      run: |
        $VERSION = "${{ steps.get_version.outputs.VERSION }}"
        $NOTES = @"
        # 🎵 Harmonic Playlist Generator $VERSION

        **Multi-Core Optimized DJ Playlist Generator**

        ## 📥 Download

        Download \`HarmonicPlaylistGenerator.exe\` below (Windows 10/11, 64-bit)

        ## 🚀 Installation

        1. Download the executable
        2. Run it (no installation required!)
        3. Select your music folder
        4. Generate playlists!

        ## 📝 What's New

        The detailed changes are listed in the automatically generated GitHub release notes.

        ## 🐛 Bug Reports

        [Report issues](https://github.com/Crusty696/HarmonicPlaylistGenkopie_V2.0/issues)

        ---

        **Generated automatically via GitHub Actions** 🤖
        "@

        $NOTES | Out-File -FilePath "release_notes.md" -Encoding UTF8

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          HarmonicPlaylistGenerator.exe
          installer_output/HPG_${{ github.ref_name }}_Setup.exe
          release-manifest.json
        body_path: release_notes.md
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifact (Backup)
      uses: actions/upload-artifact@v4
      with:
        name: HarmonicPlaylistGenerator-${{ steps.get_version.outputs.VERSION }}
        path: |
          HarmonicPlaylistGenerator.exe
          installer_output/HPG_${{ github.ref_name }}_Setup.exe
          release-manifest.json
        retention-days: 30
