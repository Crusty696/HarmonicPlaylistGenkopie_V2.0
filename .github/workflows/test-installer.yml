name: Test One-Click Installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Ermöglicht manuelles Ausführen

jobs:
  test-windows-installer:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12.10'

    - name: Display Python Version
      run: python --version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Build Script
      run: |
        cmd /c build.bat
      shell: cmd

    - name: Verify exact EXE was created
      shell: pwsh
      run: |
        $exePath = "HarmonicPlaylistGenerator.exe"
        if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
          throw "Exact installer-test executable missing: $exePath"
        }
        Get-Item -LiteralPath $exePath | Select-Object FullName, Length, LastWriteTime

    - name: Install Inno Setup
      shell: pwsh
      run: choco install innosetup --yes --no-progress

    - name: Build installer package
      shell: cmd
      run: call build_installer.bat

    - name: Silent install, frozen worker, GUI, and uninstall smoke
      timeout-minutes: 10
      run: |
        $appVersion = (python -c "from hpg_core.app_metadata import APP_VERSION; print(APP_VERSION)").Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "Could not determine APP_VERSION"
        }
        $installerPath = "installer_output/HPG_v$($appVersion)_Setup.exe"
        if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
          throw "Exact installer-test artifact missing: $installerPath"
        }
        & .github/scripts/test_installer_runtime.ps1 `
          -InstallerPath $installerPath `
          -StandaloneExePath "HarmonicPlaylistGenerator.exe"

    - name: Upload Build Artifact
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: HarmonicPlaylistGenerator-Windows
        path: |
          HarmonicPlaylistGenerator.exe
          installer_output/HPG_v*_Setup.exe
        retention-days: 7

    - name: Test Import of Core Modules
      run: |
        python -c "import hpg_core.playlist; print('playlist OK')"
        python -c "import hpg_core.analysis; print('analysis OK')"
        python -c "import hpg_core.rekordbox_importer; print('rekordbox_importer OK')"
        python -c "import hpg_core.parallel_analyzer; print('parallel_analyzer OK')"
        python -c "import hpg_core.models; print('models OK')"

  test-python-code:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: python -m pytest tests/ -q -n 0

    - name: Check Code Quality
      run: |
        Write-Host "Checking Python file compilation..."
        Get-ChildItem -Path "hpg_core" -Filter "*.py" -File | ForEach-Object {
          Write-Host "  Checking: $($_.Name)"
          python -m py_compile $_.FullName
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to compile $($_.Name)"
            exit 1
          }
        }
        python -m py_compile main.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host "✅ All Python files compile successfully"
      shell: pwsh
