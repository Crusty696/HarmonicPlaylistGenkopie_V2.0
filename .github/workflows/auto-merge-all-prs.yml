name: 🤖 Auto-Merge All PRs & Cleanup

on:
  workflow_dispatch:  # Manuell ausgelöst
    inputs:
      merge_strategy:
        description: 'Merge-Strategie'
        required: true
        default: 'squash'
        type: choice
        options:
          - squash
          - merge
          - rebase

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  auto-merge-and-cleanup:
    runs-on: ubuntu-latest
    name: 🔄 Merge All PRs & Delete Branches
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📦 Install Dependencies
        run: |
          pip install -q requests PyGithub

      - name: 🚀 Execute Auto-Merge Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MERGE_STRATEGY: ${{ github.event.inputs.merge_strategy }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import json
          from github import Github
          import time
          
          # Github-Verbindung
          gh = Github(os.environ['GITHUB_TOKEN'])
          repo = gh.get_repo(os.environ['GITHUB_REPOSITORY'])
          merge_strategy = os.environ.get('MERGE_STRATEGY', 'squash')
          
          print("🔍 Fetching all open pull requests...")
          prs = sorted(repo.get_pulls(state='open'), key=lambda x: x.updated_at, reverse=True)
          
          merge_log = []
          merged_heads = []
          failures = []
          
          if not prs:
              print("✅ Keine offenen PRs gefunden!")
              exit(0)
          
          print(f"📊 {len(prs)} offene PRs gefunden. Starte Merge-Prozess...\n")
          
          # Merge-Prioritäten definieren
          priority_order = {
              'fix-': 1,           # Bugfixes: HIGHEST
              'Fix': 1,
              'perf-': 2,          # Performance: HIGH
              'performance-': 2,
              'refactor-': 3,      # Refactoring: MEDIUM
              'cleanup-': 3,
              'code-health-': 3,
              'test-': 4,          # Tests: NORMAL
              'testing-': 4,
              'add-': 5,           # Features: LOW
              'remove-': 3,        # Cleanup: MEDIUM
          }
          
          def get_priority(pr_title):
              for keyword, priority in priority_order.items():
                  if keyword.lower() in pr_title.lower():
                      return priority
              return 10
          
          # Sortiere nach Priorität, dann nach Update-Zeit
          prs_sorted = sorted(prs, key=lambda x: (get_priority(x.title), -x.updated_at.timestamp()))
          
          for idx, pr in enumerate(prs_sorted, 1):
              try:
                  # Zustand unmittelbar vor dem Merge neu laden und den
                  # geprueften Head gegen einen TOCTOU-Wechsel binden.
                  pr = repo.get_pull(pr.number)
                  pr_number = pr.number
                  pr_title = pr.title
                  pr_branch = pr.head.ref
                  head_sha = pr.head.sha
                  
                  print(f"[{idx}/{len(prs_sorted)}] 🔄 Merging PR #{pr_number}: {pr_title}")

                  if pr.draft:
                      raise RuntimeError("Draft-PR wird nicht automatisch gemergt")
                  if pr.mergeable is not True or pr.mergeable_state != 'clean':
                      raise RuntimeError(
                          "PR ist nicht eindeutig mergebar und frei von Blockern: "
                          f"mergeable={pr.mergeable}, state={pr.mergeable_state}"
                      )

                  head_commit = repo.get_commit(head_sha)
                  check_runs = list(head_commit.get_check_runs())
                  if not check_runs:
                      raise RuntimeError("Keine CI-Check-Runs fuer den PR-Head gefunden")
                  failed_checks = [
                      f"{check.name}: {check.status}/{check.conclusion}"
                      for check in check_runs
                      if check.status != 'completed'
                      or check.conclusion not in {'success', 'neutral', 'skipped'}
                  ]
                  if failed_checks:
                      raise RuntimeError(
                          "CI-Check-Runs nicht erfolgreich abgeschlossen: "
                          + "; ".join(failed_checks)
                      )

                  combined_status = head_commit.get_combined_status()
                  if combined_status.statuses and combined_status.state != 'success':
                      raise RuntimeError(
                          "Klassische Commit-Statuses sind nicht erfolgreich: "
                          f"{combined_status.state}"
                      )
                  
                  # Merge-Methode
                  if merge_strategy == 'squash':
                      result = pr.merge(merge_method='squash', commit_message=f"🤖 Merge: {pr_title} (PR #{pr_number})", sha=head_sha)
                  elif merge_strategy == 'rebase':
                      result = pr.merge(merge_method='rebase', commit_message=f"🤖 Merge: {pr_title} (PR #{pr_number})", sha=head_sha)
                  else:
                      result = pr.merge(merge_method='merge', commit_message=f"🤖 Merge: {pr_title} (PR #{pr_number})", sha=head_sha)

                  if not result.merged:
                      raise RuntimeError(result.message or "GitHub hat den Merge abgelehnt")

                  # Nur Branches dieses Repositories und nur nach bestaetigtem
                  # Merge duerfen spaeter geloescht werden. Forks bleiben unangetastet.
                  if pr.head.repo and pr.head.repo.full_name == repo.full_name:
                      merged_heads.append(pr_branch)
                  
                  merge_log.append({
                      'pr_number': pr_number,
                      'title': pr_title,
                      'status': '✅ MERGED',
                      'branch': pr_branch
                  })
                  
                  print(f"   ✅ Successfully merged!")
                  time.sleep(1)  # Rate limiting
                  
              except Exception as e:
                  error_msg = str(e)
                  merge_log.append({
                      'pr_number': pr.number,
                      'title': pr.title,
                      'status': f'⚠️ ERROR: {error_msg[:100]}',
                      'branch': pr.head.ref
                  })
                  print(f"   ⚠️ Error: {error_msg}")
                  failures.append(f"PR #{pr.number}: {error_msg}")
                  time.sleep(1)
          
          print("\n" + "="*80)
          print("📋 MERGE-SUMMARY")
          print("="*80)
          
          for log in merge_log:
              print(f"PR #{log['pr_number']}: {log['status']}")
              print(f"   Branch: {log['branch']}")
              print()
          
          # Branch-Cleanup
          print("\n🧹 Starting branch cleanup...")
          try:
              delete_count = 0

              for branch_name in sorted(set(merged_heads)):
                  if branch_name == repo.default_branch:
                      continue
                  try:
                      ref = repo.get_git_ref(f"heads/{branch_name}")
                      ref.delete()
                      print(f"   🗑️  Deleted merged branch: {branch_name}")
                      delete_count += 1
                      time.sleep(0.5)
                  except Exception as e:
                      message = f"Branch {branch_name}: {e}"
                      failures.append(message)
                      print(f"   ⚠️  Could not delete {branch_name}: {str(e)[:50]}")
              
              print(f"\n✅ Deleted {delete_count} branches!")
              
          except Exception as e:
              failures.append(f"Branch cleanup: {e}")
              print(f"⚠️ Branch cleanup error: {str(e)}")
          
          if failures:
              print("\n❌ Auto-merge unvollstaendig:")
              for failure in failures:
                  print(f" - {failure}")
              raise SystemExit(1)
          print("\n🎉 Alle Merges wurden bestaetigt; nur deren Branches wurden bereinigt.")
          PYTHON_SCRIPT

      - name: 📊 Generate Summary Report
        if: always()
        run: |
          echo "## Auto-Merge Workflow: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Merge Strategy**: ${{ github.event.inputs.merge_strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch cleanup is restricted to branches of confirmed merged PRs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Pull the latest changes: \`git pull origin main\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify all tests pass" >> $GITHUB_STEP_SUMMARY
          echo "3. Deploy to production if needed" >> $GITHUB_STEP_SUMMARY

      - name: 🔔 Slack Notification (Optional)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '❌ Auto-merge workflow failed for HarmonicPlaylistGenkopie_V2.0'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
