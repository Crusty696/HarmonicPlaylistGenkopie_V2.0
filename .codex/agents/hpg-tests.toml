developer_instructions = """
# HPG-Tests\r
\r
## Der Befehl\r
\r
```\r
.\\venv312\\Scripts\\python.exe -m pytest tests/ -q\r
```\r
\r
**Nur `venv312`.** Python 3.12, weil numba kein 3.13+ kann. System-Python\r
liefert numba-Fehler, die wie Code-Bugs aussehen.\r
\r
`--no-cov` ist eine Entwicklungs-Abkuerzung, **nie** ein Abschlussbeleg —\r
`pytest.ini` erzwingt `--cov-fail-under=70`.\r
\r
## Die Baseline selbst zaehlen\r
\r
Zahlen aus Markdown-Dateien sind Schnappschuesse, keine Wahrheit. In diesem\r
Projekt kursierten gleichzeitig 1313, 1384, 1389 und 1492 — alle einmal\r
richtig, alle spaeter falsch. **Immer selbst laufen lassen und die Zahl aus\r
der Ausgabe nehmen**, auch wenn ein Skill eine nennt.\r
\r
`error::UserWarning:hpg_core.*` ist gesetzt: eine `UserWarning` aus `hpg_core`\r
ist ein Testfehler, kein Rauschen.\r
\r
## Was ein guter Test hier prueft\r
\r
**Verhalten, nicht Anwesenheit.** `assert CACHE_VERSION == 30` behauptet, eine\r
Konstante sei gleich sich selbst — es muss bei jedem Bump von Hand nachgezogen\r
werden und faengt nichts. Besser: dass die Version im Dateinamen landet, also\r
ein Bump wirklich eine neue Datenbank erzeugt.\r
\r
**Unabhaengig von ausgelieferten Daten.** Ein Test, der ueber\r
`get_tolerances` die mitgelieferte Kalibrierung liest, kippt, sobald neu\r
kalibriert wird — obwohl die geprueften Funktionen unveraendert sind. Solche\r
Tests pinnen die Schwellen per Fixture. Wer die gelernten Werte pruefen will,\r
tut das in der Datei, die dafuer da ist.\r
\r
**Isoliert vom Nutzerzustand.** `HPG_CACHE_FILE` und `HPG_TOLERANCES_FILE` auf\r
`tmp_path` setzen. Ein Test, der `%LOCALAPPDATA%` liest, liefert je nach\r
Maschine andere Ergebnisse.\r
\r
## Die Fehlerklassen, die hier durchgerutscht sind\r
\r
Schreib Tests, die diese fangen — sie sind alle real vorgekommen:\r
\r
- Nur **einer** der beiden Analysepfade geaendert.\r
- **Cache-Roundtrip** nie geprueft: Feld definiert, aber nie gespeichert und\r
  zurueckgelesen.\r
- **Alt-Zeilen** ohne das neue Feld nie geprueft.\r
- Ein Fixture, das die **Realitaet nicht abbildet**: eine Bass-Huellkurve aus\r
  Einzelsample-Spitzen (1 % Belegung) statt der realen 98-100 %. Der Test war\r
  gruen und die Implementierung falsch, oder umgekehrt.\r
- Eine **Vorbedingung fehlt** und der Test prueft still nichts mehr.\r
\r
## Fixtures\r
\r
`tests/conftest.py` liefert Audio (`click_128bpm`, `structured_audio_128bpm`,\r
Akkorde), fertige Tracks (`house_track`, `dj_set_8tracks`,\r
`all_camelot_tracks`) und Invarianten-Helfer (`assert_mix_points_valid`,\r
`assert_phrase_aligned`). Mixpoint-Tests immer ueber die Helfer, nicht mit\r
eigenen Toleranzen.\r
\r
`tests/performance_fixtures.py` liefert vor-analysierte Tracks ohne\r
Audio-Generierung.\r
\r
## Jenseits von pytest\r
\r
`e2e_check.py` prueft die Kette an echtem Audio. `tools/validation_run.py`\r
laeuft gegen die reale Bibliothek. `tools/prepare_dj_blind_test.py` erzeugt\r
anonymisierte A/B-Clips fuer Hoertests.\r
\r
**Eine gruene Suite ist kein Beleg fuer musikalische Qualitaet.** Der\r
schwerwiegendste Fehler dieses Projekts — ein Mixpunkt, der eine ganze Phrase\r
zu spaet lag — hat keinen einzigen Test rot gemacht. Dafuer gibt es den\r
Hoertest.\r
\r
## Was "fertig" heisst\r
\r
1. Volle Suite gruen, Zahl **selbst gesehen**\r
2. Coverage-Gate 70 % gehalten\r
3. Bei DSP-/Analyse-Aenderungen: `e2e_check.py` auf echtem Audio\r
4. Bei geaendertem Analyse-Output: `CACHE_VERSION` gebumpt\r
5. Keine neue `UserWarning` aus `hpg_core`\r
\r
Ohne Punkt 1 gibt es keine Erfolgsmeldung — auch kein "sollte gruen sein"."""
