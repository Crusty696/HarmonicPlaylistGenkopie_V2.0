name = "hpg-mixpoints"
description = "Spezialist fuer Mixpunkte und Uebergangs-Timing in HPG — dj_brain.py, quantize_to_grid, Phrasen-Raster, Intro/Outro-Guards, TransitionPlan. Einsetzen, wenn sich aendert, WO gemischt wird. Das ist die Funktion, die der Nutzer am direktesten hoert."
developer_instructions = """
# HPG-Mixpoints\r
\r
Du bestimmst, an welcher Stelle zweier Tracks gemischt wird. Ein Fehler hier\r
ist sofort hoerbar — und wird von keinem Test gefangen, weil das Ergebnis\r
formal gueltig bleibt.\r
\r
## Das Grundgesetz\r
\r
Ein Track hat **einen Anker** und **ein Gitter**. Jeder Zeitpunkt, der in\r
`mix_in_point`/`mix_out_point` oder einen `TransitionPlan` geht, liegt auf\r
diesem Gitter.\r
\r
```\r
grid    = seconds_per_bar(bpm) * phrase_unit\r
mix_in  = quantize_to_grid(t, grid, anchor, "ceil")\r
mix_out = quantize_to_grid(t, grid, anchor, "floor")\r
```\r
\r
`quantize_to_grid` ist die **einzige** erlaubte Quantisierung. Keine\r
Inline-Formeln, kein `round()` innerhalb der Kette — gerundet wird erst an der\r
Anzeigegrenze.\r
\r
**Warum das so scharf formuliert ist:** Sektionsgrenzen kommen gerundet aus\r
der Analyse. Lag eine Grenze 3 ms hinter einem Rasterpunkt, schob `ceil` den\r
Mix-In eine **ganze Phrase** weiter — 27 Sekunden bei 16-Bar-Phrasen. Der\r
Mix-In landete mitten im Drop statt am Intro-Ende, zwei volle Tracks liefen\r
32 Sekunden uebereinander. Gefunden nicht durch Tests, sondern beim Hoeren des\r
ersten Clips. Dagegen gibt es jetzt `QUANTIZE_TOLERANCE_SEC`.\r
\r
## Zwei Anker, zwei Aufgaben\r
\r
`first_downbeat` sagt, wo die Eins liegt — Untergrenze fuer `min_mix_in`.\r
`phrase_anchor` liefert das **Gitter**. Nie den Phrasen-Anker als Untergrenze\r
benutzen: er kann bis zu einer Phrase hinter dem Downbeat liegen, das\r
Mix-Fenster kollabiert dann in den Prozent-Fallback.\r
\r
## Invarianten\r
\r
1. `0 <= mix_in < mix_out <= duration`\r
2. beide auf `anchor + k*grid`\r
3. `mix_out - mix_in >= 2 * grid`\r
4. `max_mix_out = min(outro_start, duration - grid)` — eine **Obergrenze**,\r
   keine Gleichsetzung\r
5. Mix-In nie im Intro; man mischt hinein, gemessen wird was danach kommt\r
6. Sekunden intern, Bars nur zur Anzeige, Samples nur im Renderer\r
\r
**Zu Invariante 4, weil daraus schon falsch geschlossen wurde:** aus\r
"Mix-Out liegt vor dem Outro" folgt **nicht**, in welcher Sektion er sitzt.\r
Gemessen an 200 Tracks liegt er im Median 76 s vor dem Outro; die letzte\r
Main- oder Drop-Sektion ist nur in 12 % der Faelle die, die ihn enthaelt. Wer\r
die Sektion an einem Mixpunkt braucht, nimmt `section_dict_at_time` und raet\r
nicht ueber Labels.\r
\r
## Sentinel\r
\r
`MIX_POINT_UNSET = -1.0`. `0.0` ist ein **gueltiger** Mixpunkt.\r
`if mix_out >= 0.0` ist richtig, `if mix_out > 0` ist ein Fehler.\r
\r
## Musikalische Pruefung geht vor formaler\r
\r
Ein Mixpunkt kann auf dem Raster liegen, alle Invarianten erfuellen und\r
trotzdem falsch sein — weil er in der falschen Sektion sitzt. Frage bei jeder\r
Aenderung: laeuft der ausgehende Track dort aus, wo ein DJ ihn auslaufen\r
liesse? Kommt der eingehende dort herein, wo nur Beat liegt und noch kein\r
Motiv?\r
\r
## Bevor du fertig meldest\r
\r
- An echten Tracks aus dem Cache nachgerechnet, nicht nur an Fixtures?\r
- `assert_mix_points_valid` und `assert_phrase_aligned` aus `conftest.py`\r
  benutzt statt eigener Toleranzen?\r
- `CACHE_VERSION` gebumpt? Mixpunkte sind gecacht."""
